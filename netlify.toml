[build]
  command = "npm run build"
  # Next.js runtime expects the .next build dir; declaring it here
  # overrides any stale publish-directory value in the Netlify UI.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Server-output Next.js (the admin portal needs SSR + middleware).
# The runtime must be explicit on sites originally set up as static —
# auto-detection doesn't kick in when the site pre-dates the switch.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Old WordPress URLs (devsorb.com before the Next.js launch) → new pages,
# so indexed links and bookmarks keep working. Netlify ignores trailing
# slashes when matching.
[[redirects]]
  from = "/contact"
  to = "/contact-us"
  status = 301
  force = true

[[redirects]]
  from = "/hire-developers"
  to = "/hire-developer"
  status = 301
  force = true

[[redirects]]
  from = "/job/*"
  to = "/careers"
  status = 301
  force = true

[[redirects]]
  from = "/job"
  to = "/careers"
  status = 301
  force = true

